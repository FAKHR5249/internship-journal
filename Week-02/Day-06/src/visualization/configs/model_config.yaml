# ==========================================
# Model Configuration
# ==========================================

random_state: 42

models:

  Dummy:
    strategy: median

  LinearRegression: {}

  Ridge:
    alpha: 1.0

  Lasso:
    alpha: 0.01

  ElasticNet:
    alpha: 0.01
    l1_ratio: 0.5

  DecisionTree:
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2

  RandomForest:
    n_estimators: 100
    max_depth: 10
    random_state: 42

  GradientBoosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 5
    random_state: 42